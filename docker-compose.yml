services:
  postgres:
    image: postgres:16-alpine
    container_name: okapi_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: okapi_real_estate
    ports:
      - "5432:5432"
    volumes:
      - okapi_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  okapi_postgres_data:
