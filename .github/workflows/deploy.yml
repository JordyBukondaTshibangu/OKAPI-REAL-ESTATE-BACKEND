# .github/workflows/deploy.yml

name: Deploy to Railway

on:
  push:
    branches:
      - main
      - qa
      - dev

jobs:
  deploy:
    name: Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build NestJS app
        run: npm run build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set Railway Service ID
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "SERVICE_ID=${{ secrets.RAILWAY_SERVICE_ID_PROD }}" >> $GITHUB_ENV
          elif [ "${{ github.ref_name }}" == "qa" ]; then
            echo "SERVICE_ID=${{ secrets.RAILWAY_SERVICE_ID_QA }}" >> $GITHUB_ENV
          elif [ "${{ github.ref_name }}" == "dev" ]; then
            echo "SERVICE_ID=${{ secrets.RAILWAY_SERVICE_ID_DEV }}" >> $GITHUB_ENV
          fi

      - name: Run Prisma migrations
        run: railway run --service ${{ env.SERVICE_ID }} npx prisma migrate deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        run: railway up --service ${{ env.SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}